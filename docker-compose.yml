version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: document_vault_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: document_vault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d document_vault"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: document_vault_api
    restart: always
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/document_vault?schema=public
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
